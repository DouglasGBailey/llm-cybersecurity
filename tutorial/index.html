<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ethical Hacking, Hands-On — LLM Cybersecurity Agent Platform</title>
<style>
  :root {
    --bg: #1e1e2e;
    --surface: #262637;
    --surface-2: #2c2c40;
    --border: #3a3a52;

    --dim: #8890b5;
    --dimmer: #6c7086;
    --accent: #cba6f7;
    --accent-dim: #8c7ab5;

  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);

  }
  code, pre, .mono {
    font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
  }

  /* ---------- layout ---------- */
  .shell { display: flex; min-height: 100vh; }
  .sidebar {
    width: 280px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 24px 0;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .sidebar-header { padding: 0 20px 20px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
  .sidebar-header .kicker { color: var(--accent); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
  .sidebar-header h1 { font-size: 1.05rem; margin: 6px 0 0; line-height: 1.35; }
  .progress-summary { padding: 12px 20px; font-size: 0.8rem; color: var(--dim); }
  .progress-bar { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-top: 6px; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent-dim), var(--accent)); border-radius: 999px; transition: width 0.3s ease; width: 0%; }

  nav.modules { padding: 4px 12px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: 7px; cursor: pointer;
    font-size: 0.87rem; color: var(--dim);
    border: 1px solid transparent;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--text); }
  .nav-item.active { background: var(--surface-2); color: var(--text); border-color: var(--border); }
  .nav-badge {
    width: 20px; height: 20px; flex-shrink: 0; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.68rem; font-weight: 700;
    background: var(--bg); border: 1px solid var(--dimmer); color: var(--dimmer);

  .nav-item.active .nav-badge { border-color: var(--accent); color: var(--accent); }

    flex: 1;
    min-width: 0;
    padding: 48px 56px 96px;
    max-width: 880px;
  }
  @media (max-width: 900px) {
    .sidebar { position: fixed; z-index: 20; transform: translateX(-100%); transition: transform 0.2s ease; }
    .sidebar.open { transform: translateX(0); }
    main { padding: 24px 20px 80px; }

  .module-kicker { color: var(--accent); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
  h2.module-title { font-size: 2rem; margin: 6px 0 4px; text-wrap: balance; letter-spacing: -0.01em; }
  .module-sub { color: var(--dim); font-size: 1.02rem; margin: 0 0 32px; max-width: 62ch; }

  main h4 { font-size: 1.02rem; margin: 24px 0 8px; color: var(--accent); }
  main p { margin: 0 0 16px; color: var(--text); max-width: 68ch; }

  main li { margin-bottom: 6px; }
  main strong { color: #fff; font-weight: 600; }
  main a { color: var(--blue); }

  .callout {
    border: 1px solid var(--border); border-left: 3px solid var(--accent);
    background: var(--surface); border-radius: 6px; padding: 14px 18px;
    margin: 20px 0; max-width: 66ch;
  }
  .callout.warn { border-left-color: var(--yellow); }
  .callout.danger { border-left-color: var(--red); }
  .callout.good { border-left-color: var(--green); }

  .callout.danger .callout-label { color: var(--red); }

  pre.code .k1 { color: var(--accent); }        /* flag/keyword */
  pre.code .s1 { color: var(--green); }         /* string/value */

    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 6px; font-size: 0.87em; color: var(--yellow);
  }

  table.spec { width: 100%; border-collapse: collapse; margin: 14px 0 22px; font-size: 0.88rem; }
  table.spec th, table.spec td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  table.spec th { color: var(--dim); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; }

    background: linear-gradient(180deg, rgba(203,166,247,0.06), transparent 40%), var(--surface);

  .lab-label { display: flex; align-items: center; gap: 8px; color: var(--accent); font-weight: 700; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
  .lab-label .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

  .quiz { margin: 40px 0; border-top: 1px solid var(--border); padding-top: 28px; }
  .quiz h3 { margin-top: 0; }
  .quiz-q { margin-bottom: 22px; }
  .quiz-q p.qtext { font-weight: 600; margin-bottom: 10px; color: #fff; }
  .quiz-opt {
    display: block; padding: 10px 14px; margin-bottom: 8px;
    border: 1px solid var(--border); border-radius: 7px; cursor: pointer;
    font-size: 0.9rem; background: var(--surface);

  .quiz-opt.selected { border-color: var(--accent); background: var(--surface-2); }
  .quiz-opt.correct { border-color: var(--green); background: rgba(166,227,161,0.1); }
  .quiz-opt.incorrect { border-color: var(--red); background: rgba(243,139,168,0.1); }
  .quiz-feedback { font-size: 0.85rem; margin-top: 6px; padding-left: 2px; }
  .quiz-feedback.correct { color: var(--green); }
  .quiz-feedback.incorrect { color: var(--red); }

  .module-nav-buttons { display: flex; justify-content: space-between; margin-top: 48px; border-top: 1px solid var(--border); padding-top: 24px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 7px; font-size: 0.88rem; cursor: pointer;

  .btn.primary:hover { background: #d8bcfa; }
  .btn:disabled { opacity: 0.35; cursor: default; pointer-events: none; }

{
  id: "ethics",
  title: "Welcome, and the One Rule That Matters",
  sub: "What ethical hacking actually is, and why authorization is the whole game.",
  body: `
    <p>Every skill you'll build in this tutorial — reconnaissance, vulnerability
    analysis, exploitation — is dual-use. The exact same techniques that make you
    a competent security professional can be used to break the law. The single
    thing separating the two is <strong>authorization</strong>: do you have
    explicit, documented permission to test this specific system?</p>

    <p>This isn't a formality. It's the difference between a career and a
    felony charge in most jurisdictions. So before anything technical, the rule:</p>

    <div class="callout danger">
      <span class="callout-label">The one rule</span>
      <p>Never run a technique from this tutorial — recon, scanning, or
      exploitation — against anything you don't own or don't have
      <em>written</em> authorization to test. Not "I'm pretty sure it's fine."
      Written. In advance.</p>
    </div>

    <p>That's why this whole tutorial runs against <strong>DVWA</strong>
    (Damn Vulnerable Web Application) — a deliberately-broken practice target
    built specifically for this purpose, running in a Docker container on your
    own machine. You own it. You can break it, fix it, and reset it as many
    times as you want.</p>

    <h3>How the platform enforces this, not just suggests it</h3>
    <p>The tool you're learning with — the LLM Cybersecurity Agent Platform —
    was built around one architectural rule: <strong>no agent can act on a
    target that isn't explicitly named in advance.</strong> This is enforced
    by a component called <code class="inline">ScopeGuard</code>, and it's the
    first thing every single agent checks before doing anything else.</p>

    <p>There are actually <strong>three separate</strong> authorization lists,
    because "I can scan this" and "I can exploit this" and "I can read this
    code" are three different claims:</p>

    <table class="spec">
      <tr><th>List</th><th>Grants permission to</th></tr>
      <tr><td><code class="inline">authorized_targets</code></td><td>Recon and hygiene scanning of a network host</td></tr>
      <tr><td><code class="inline">authorized_code_paths</code></td><td>Static analysis of a local source directory</td></tr>
      <tr><td><code class="inline">authorized_exploit_targets</code></td><td>Live exploitation — and only if the target is marked <code class="inline">resettable: true</code></td></tr>
    </table>

    <p>Being on one list <em>never</em> implies you're on another. You'll see
    this directly in Module 9, when you try to run the exploitation agent
    against a target that's only recon-authorized — and it refuses, before
    sending a single request.</p>
  `,
  lab: `
    <div class="lab-label"><span class="dot"></span>Hands-on: set up your lab</div>
    <p>If you haven't already, get the project and its practice target running:</p>
    <pre class="code"><span class="c1"># 1. Set up the Python environment</span>
cd llm-cybersecurity
python3 -m venv venv
<span class="k1">source</span> venv/bin/activate
pip install -r requirements.txt

<span class="c1"># 2. Create your scope file from the template</span>
cp config/scope.example.yaml config/scope.yaml
<span class="c1"># edit config/scope.yaml -- it already has a local-dvwa entry to start from</span>

<span class="c1"># 3. Start the practice target (DVWA) in Docker</span>
docker run -d --name llm-cybersec-dvwa -p 8080:80 vulnerables/web-dvwa

<span class="c1"># 4. One-time DVWA setup: initialize its database</span>
<span class="c1"># visit http://127.0.0.1:8080/setup.php in a browser and click</span>
<span class="c1"># "Create / Reset Database" -- every fresh container needs this once.</span></pre>
    <p>Log in at <code class="inline">http://127.0.0.1:8080/login.php</code> with
    the default credentials <code class="inline">admin</code> /
    <code class="inline">password</code> — you'll learn exactly why that's a
    security problem in Module 9. Then go to <strong>DVWA Security</strong> in
    the left menu and set the security level to <strong>low</strong>, so the
    vulnerabilities you'll be studying are actually reachable.</p>
    <div class="callout good">
      <span class="callout-label">Checkpoint</span>
      <p>Open <code class="inline">config/scope.yaml</code> and confirm it has an
      <code class="inline">authorized_targets</code> entry named
      <code class="inline">local-dvwa</code> pointing at <code class="inline">127.0.0.1</code>,
      <code class="inline">web_port: 8080</code>. That's what makes every
      command in this tutorial legal to run.</p>
    </div>
  `,
  quiz: [
    {
      q: "What's the single factor that separates ethical hacking from a crime, given identical techniques?",
      options: ["Using a VPN", "Explicit, written authorization from the target's owner", "Only testing during business hours", "Not extracting any real data"],
      correct: 1,
      explain: "Same skills, same tools -- the only thing that makes it legal and ethical is documented permission in advance."
    },
    {
      q: "Why does this platform use three separate authorization lists instead of one?",

        "To make the config file longer",
        "Because recon, code analysis, and exploitation are different claims -- being allowed to do one doesn't imply the others",

        "SQLite performs better with multiple tables"
      ],
      correct: 1,
      explain: "\"I can scan this host,\" \"I own this code,\" and \"I can exploit this host\" are genuinely different authorizations -- conflating them would be a real safety gap."
    }
  ]

{
  id: "recon",
  title: "Reconnaissance: Mapping the Target",
  sub: "Before you can assess anything, you have to know what's actually there.",
  body: `
    <p>Reconnaissance ("recon") is the first phase of any real security
    assessment: figuring out what's actually exposed before you evaluate any
    of it. Security professionals split recon into two flavors:</p>

    <table class="spec">
      <tr><th>Type</th><th>What it means</th><th>Example</th></tr>
      <tr><td><strong>Passive</strong></td><td>Gathering information without touching the target directly</td><td>WHOIS lookup, public DNS records, search engine results</td></tr>
      <tr><td><strong>Active</strong></td><td>Directly interacting with the target to learn about it</td><td>Port scanning, service fingerprinting</td></tr>
    </table>

    <p>Active recon is <em>not</em> exploitation — you're not breaking
    anything, just asking "what's listening, and what is it?" But it's still
    real traffic hitting a real system, which is exactly why it still requires
    authorization.</p>

    <h3>What <code class="inline">ReconAgent</code> actually does</h3>
    <p>The platform's recon agent runs three specific, read-only tools —
    nothing more, nothing improvised:</p>
    <ul>
      <li><strong><code class="inline">dig</code></strong> — resolves DNS records for the target</li>
      <li><strong><code class="inline">whois</code></strong> — looks up domain/IP registration info</li>
      <li><strong><code class="inline">nmap</code></strong> — a capped port/service scan (top 100 ports, version detection, default safe scripts only — no aggressive or exploit-capable scan types)</li>
    </ul>
    <p>Notice what's <em>not</em> on that list: no brute-forcing, no
    vulnerability-scanning scripts, no aggressive timing. This agent answers
    "what's here," full stop.</p>
  `,
  lab: `

    <p>You should see findings like <code class="inline">dns-resolution</code>
    (127.0.0.1) and, if <code class="inline">nmap</code> isn't installed on
    your machine, a <code class="inline">tool-unavailable</code> finding

    <div class="callout">
      <span class="callout-label">Try this</span>
      <p>Run the same command again with <code class="inline">--target</code>

    </div>
  `,
  quiz: [

      correct: 1,
      explain: "Port scanning maps what's listening -- it doesn't try to breach anything. Still requires authorization since it's real traffic against a real system."
    },
    {
      q: "Why does ReconAgent use a capped nmap scan instead of an aggressive/full scan?",
      options: [
        "Aggressive scans are illegal everywhere",
        "To keep the agent's behavior predictable and non-disruptive -- read-only enumeration, not stress-testing",
        "nmap doesn't support aggressive scans",
        "It's faster to type"

{
  id: "webapp",
  title: "Web Application Hygiene",
  sub: "Most real-world breaches start with something boring: a missing header, an old server version.",
  body: `
    <p>Every time your browser loads a page, the server sends back HTTP
    <strong>response headers</strong> — metadata about how the browser should
    treat that page. Several of them exist specifically to block entire
    classes of attack, and when they're missing, the browser has no
    instructions to defend itself.</p>

    <table class="spec">
      <tr><th>Header</th><th>What it prevents</th></tr>
      <tr><td><code class="inline">Content-Security-Policy</code></td><td>Restricts what scripts/resources a page can load -- a major defense against XSS (Module 8)</td></tr>
      <tr><td><code class="inline">Strict-Transport-Security</code></td><td>Forces the browser to only ever use HTTPS for this site</td></tr>
      <tr><td><code class="inline">X-Frame-Options</code></td><td>Stops the page being embedded in a hidden iframe on someone else's site ("clickjacking")</td></tr>
      <tr><td><code class="inline">X-Content-Type-Options</code></td><td>Stops the browser "guessing" a file's type in a way attackers can abuse</td></tr>
      <tr><td><code class="inline">Referrer-Policy</code></td><td>Controls what URL info leaks to other sites when a user clicks a link away from this page</td></tr>
      <tr><td><code class="inline">Permissions-Policy</code></td><td>Restricts which browser features (camera, mic, location) a page can even ask to use</td></tr>
    </table>

    <p>None of these alone is catastrophic. But their absence is a real,
    common finding on real assessments — and a well-run organization tracks
    and fixes them the same way it tracks anything else.</p>

    <h3>The other thing web recon looks for: information disclosure</h3>
    <p>A <code class="inline">Server: Apache/2.4.25</code> header tells an
    attacker exactly which known vulnerabilities to look up for that specific
    version. <code class="inline">robots.txt</code> can accidentally reveal
    admin paths nobody meant to advertise. None of this is a vulnerability by
    itself — it's reconnaissance that makes a <em>real</em> vulnerability
    easier to find and exploit later.</p>
  `,
  lab: `
    <div class="lab-label"><span class="dot"></span>Hands-on: check DVWA's web hygiene</div>

    <p>Open <code class="inline">reports/local-dvwa-report.md</code> afterward.
    You should see a <code class="inline">missing-security-headers</code>
    finding listing all six headers above, plus a
    <code class="inline">server-banner</code> finding disclosing the exact
    Apache version. This is a real, unmodified DVWA container — these are
    genuine findings, not staged examples.</p>
  `,

      correct: 1,

{
  id: "api",
  title: "API Security",
  sub: "Modern apps are mostly APIs wearing a UI. They get attacked directly, UI or not.",
  body: `
    <p>Most modern web/mobile apps are a frontend talking to a backend
    <strong>API</strong> — a set of URL endpoints that accept requests and
    return data, usually as JSON. The API itself can be reached directly,
    bypassing the UI entirely, which means it needs its own security
    controls, not just "the website looks fine."</p>

    <h3>What this platform checks</h3>
    <ul>
      <li><strong>Exposed API specifications</strong> — an
      <code class="inline">openapi.json</code> or Swagger file left publicly
      reachable documents every endpoint the API has, including ones that
      were never meant to be public. Great for developers, great for
      attackers too if it's exposed by mistake.</li>
      <li><strong>Missing declared security schemes</strong> — if the API's
      own specification doesn't declare an authentication requirement, that's
      worth flagging even before testing whether auth is actually enforced.</li>
      <li><strong>GraphQL introspection left enabled</strong> — GraphQL APIs
      can expose a query that returns their <em>entire schema</em>: every
      type, field, and mutation available. Extremely convenient in
      development, a real information leak in production.</li>
      <li><strong>Verbose error pages</strong> — a stack trace in an API

      demonstrates the <em>clean</em> result — the agent correctly reporting
      "nothing found" rather than fabricating a finding. A tool that never
      says "no issues here" isn't trustworthy.</p>
    </div>
  `,

    <p>Two categories of infrastructure hygiene this platform checks:</p>

    <h3>TLS certificates</h3>
    <p>HTTPS relies on a certificate that (a) proves the server is who it
    claims to be, and (b) hasn't expired. An expired certificate doesn't just
    look bad in a browser warning — depending on how a client is configured,
    it can silently fail closed (breaking the service) or, worse, get ignored
    entirely (defeating the point of TLS). This platform flags certs that are
    already expired, and separately warns when one is expiring soon (under 30
    days), so it can be renewed before it becomes an outage.</p>

    <h3>Email authentication: SPF, DMARC, DNSSEC</h3>
    <p>These are DNS records, not something you'd usually associate with
    "web security," but they directly prevent email spoofing — someone
    sending mail that appears to come from your domain:</p>
    <table class="spec">
      <tr><th>Record</th><th>What it does</th></tr>
      <tr><td><strong>SPF</strong></td><td>Lists which mail servers are allowed to send email for your domain</td></tr>
      <tr><td><strong>DMARC</strong></td><td>Tells receiving mail servers what to do with messages that fail SPF/DKIM checks</td></tr>
      <tr><td><strong>DNSSEC</strong></td><td>Cryptographically signs DNS responses so they can't be tampered with in transit</td></tr>
    </table>

    <div class="callout warn">
      <span class="callout-label">A lesson from this project's own history</span>
      <p>The TLS check in this platform <strong>never assumes a default port
      like 443</strong>. Early in development, it did — and on a shared host
      running several unrelated services, that default caused it to
      accidentally fetch and report a completely different service's real
      certificate instead of the intended lab target's. The fix: if a target
      doesn't explicitly configure <code class="inline">tls_port</code>, the

{
  id: "vulnclasses",
  title: "Understanding the Big Four Vulnerability Classes",
  sub: "The mechanics behind SQL injection, XSS, command injection, and weak credentials -- before you exploit any of them.",
  body: `
    <p>Module 9 will have you actually exploit these against DVWA. First,
    understand <em>why</em> each one works — exploiting something you don't
    understand is memorizing a magic incantation, not learning security.</p>

    <h3>1. SQL Injection (SQLi)</h3>
    <p>Web apps often build database queries by directly inserting user
    input into a query string:</p>
    <pre class="code"><span class="c1">-- the app's intended query, with id = user input</span>
SELECT first_name, last_name FROM users WHERE user_id = '<span class="s1">1</span>'</pre>
    <p>If the app doesn't validate that input, and you submit
    <code class="inline">' UNION SELECT user,password FROM users -- -</code>
    as the ID instead of a number, the query becomes:</p>
    <pre class="code">SELECT first_name, last_name FROM users WHERE user_id = <span class="s1">''</span> UNION SELECT user,password FROM users -- -'</pre>
    <p>The <code class="inline">UNION SELECT</code> asks the database to
    append a <em>second, completely different</em> query's results —
    usernames and password hashes — onto the original output. The
    <code class="inline">-- -</code> comments out the rest of the original
    query so your addition is syntactically valid. This is why SQLi is so
    dangerous: it isn't tricking the app, it's talking to the database
    directly through the app.</p>

    <h3>2. Cross-Site Scripting (XSS)</h3>
    <p>If a page takes user input and writes it back into the HTML response
    <em>without escaping it</em>, and that input contains
    <code class="inline">&lt;script&gt;</code> tags, the browser will execute
    it as real code — in the context of that page, with access to its
    cookies and session. Attackers use this to steal sessions, deface pages,
    or pivot to further attacks. "Reflected" XSS (the type this tutorial
    covers) happens when the malicious input comes right back in the
    response to that same request — often delivered via a crafted link the
    victim is tricked into clicking.</p>

    <h3>3. Command Injection</h3>
    <p>If an app builds an operating-system command from user input — say, a
    "ping this IP" feature that shells out to the real <code class="inline">ping</code>
    command — and doesn't sanitize that input, a shell metacharacter like
    <code class="inline">;</code> lets you append a second, completely
    unrelated command:</p>
    <pre class="code">127.0.0.1<span class="k1">; whoami</span></pre>
    <p>The shell treats <code class="inline">;</code> as "end this command,
    start a new one" — so the app dutifully pings <code class="inline">127.0.0.1</code>
    <em>and</em> runs <code class="inline">whoami</code>, handing you
    arbitrary command execution on the server.</p>

    <h3>4. Weak / Default Credentials</h3>
    <p>The simplest one conceptually, and one of the most common in the
    real world: an app ships with (or an admin sets) a predictable password
    like <code class="inline">admin</code>/<code class="inline">password</code>,
    and it's never changed. No clever technique required — just knowing
    (or guessing from a small, well-known list) what the default is.</p>

    <div class="callout">
      <span class="callout-label">Where these map in industry frameworks</span>
      <p>SQLi, XSS, and command injection all fall under
      <strong>OWASP Top 10 2021 — A03: Injection</strong> (they're all
      variations of "untrusted input got interpreted as code/commands
      instead of data"). Weak credentials fall under
      <strong>A07: Identification and Authentication Failures</strong>.
      You'll see these exact labels in your reports starting in Module 9.</p>
    </div>
  `,
  lab: null,
  quiz: [
    {
      q: "In the SQLi example, what does `-- -` at the end of the payload actually do?",
      options: [
        "It's a typo the attacker made",
        "It comments out the rest of the original query, so the injected UNION SELECT is syntactically valid on its own",
        "It encrypts the payload",
        "It tells the database to delete all rows"
      ],
      correct: 1,
      explain: "Without commenting out the trailing original SQL, the injected query would likely be a syntax error and fail."
    },
    {
      q: "Why does `127.0.0.1; whoami` work as a command injection payload?",
      options: [
        "whoami is a special hacking command",
        "The shell interprets ; as 'end this command, start a new one' -- so both the intended ping and the injected whoami run",
        "It exploits a bug in the ping utility itself",
        "It only works on Windows"
      ],
      correct: 1,
      explain: "This is exactly how shells work -- ; is a command separator. The vulnerability is that user input reaches the shell unsanitized at all."
    },
    {
      q: "Which OWASP Top 10 2021 category covers SQLi, XSS, and command injection?",
      options: ["A01: Broken Access Control", "A02: Cryptographic Failures", "A03: Injection", "A07: Identification and Authentication Failures"],
      correct: 2,
      explain: "All three are the same underlying pattern: untrusted input gets interpreted as code/commands rather than treated as inert data."
    }
  ]
},

    <p>Every live scan is recorded (SQLite, keyed by target). Each new scan

    target has nothing to compare against — it's the baseline, and it's

/* ======================================================================
   Engine
   ====================================================================== */
const STORAGE_KEY = "cybersec-tutorial-progress-v1";

function loadProgress() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch (e) { return {}; }
}
function saveProgress(p) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
}
let progress = loadProgress(); // { moduleId: true }
let currentIndex = 0;
let quizState = {}; // { moduleId: { qIndex: selectedOption } }

function renderNav() {
  const navList = document.getElementById("nav-list");
  navList.innerHTML = "";
  MODULES.forEach((m, i) => {
    const item = document.createElement("div");
    item.className = "nav-item" + (i === currentIndex ? " active" : "") + (progress[m.id] ? " done" : "");
    item.innerHTML = `<span class="nav-badge">${progress[m.id] ? "&#10003;" : (i + 1)}</span><span>${m.title}</span>`;
    item.onclick = () => { currentIndex = i; render(); document.querySelector(".sidebar").classList.remove("open"); window.scrollTo(0,0); };
    navList.appendChild(item);
  });
  const doneCount = Object.keys(progress).filter(k => progress[k]).length;
  document.getElementById("progress-text").textContent = `${doneCount} of ${MODULES.length} modules complete`;
  document.getElementById("progress-fill").style.width = (doneCount / MODULES.length * 100) + "%";
}

function markComplete(moduleId) {
  progress[moduleId] = true;
  saveProgress(progress);
  renderNav();
}

function renderQuiz(m) {
  if (!m.quiz || m.quiz.length === 0) return "";
  if (!quizState[m.id]) quizState[m.id] = {};
  let html = `<div class="quiz"><h3>Check your understanding</h3>`;
  m.quiz.forEach((q, qi) => {
    html += `<div class="quiz-q" data-qi="${qi}"><p class="qtext">${qi + 1}. ${q.q}</p>`;
    q.options.forEach((opt, oi) => {
      html += `<div class="quiz-opt" data-oi="${oi}" onclick="answerQuiz('${m.id}', ${qi}, ${oi})">${opt}</div>`;
    });
    html += `<div class="quiz-feedback" id="feedback-${m.id}-${qi}"></div>`;
    html += `</div>`;
  });
  html += `</div>`;
  return html;
}

function answerQuiz(moduleId, qi, oi) {
  const m = MODULES.find(mm => mm.id === moduleId);
  const q = m.quiz[qi];
  quizState[moduleId][qi] = oi;
  const qDiv = document.querySelector(`.quiz-q[data-qi="${qi}"]`);
  const opts = qDiv.querySelectorAll(".quiz-opt");
  opts.forEach((el, i) => {
    el.classList.remove("selected", "correct", "incorrect");
    if (i === oi) el.classList.add("selected");
  });
  const feedback = document.getElementById(`feedback-${moduleId}-${qi}`);
  if (oi === q.correct) {
    opts[oi].classList.add("correct");
    feedback.textContent = "Correct — " + q.explain;
    feedback.className = "quiz-feedback correct";
  } else {
    opts[oi].classList.add("incorrect");
    opts[q.correct].classList.add("correct");
    feedback.textContent = "Not quite — " + q.explain;
    feedback.className = "quiz-feedback incorrect";
  }
  checkAllAnswered(m);
}

function checkAllAnswered(m) {
  if (!m.quiz || m.quiz.length === 0) return;
  const answered = Object.keys(quizState[m.id] || {}).length;
  if (answered === m.quiz.length) {
    markComplete(m.id);
  }
}

function render() {
  const m = MODULES[currentIndex];
  const main = document.getElementById("main-content");
  const isLast = currentIndex === MODULES.length - 1;

  let html = `
    <div class="module-kicker">Module ${currentIndex + 1} of ${MODULES.length}</div>
    <h2 class="module-title">${m.title}</h2>
    <p class="module-sub">${m.sub}</p>
    ${m.body}
    ${m.lab ? `<div class="lab">${m.lab}</div>` : ""}
    ${renderQuiz(m)}
    ${(!m.quiz || m.quiz.length === 0) ? `
      <div style="margin-top:32px;">
        <button class="btn primary" onclick="markComplete('${m.id}'); render();">
          ${isLast ? "Mark tutorial complete" : "Mark module complete"}
        </button>
      </div>` : ""}
    <div class="module-nav-buttons">
      <button class="btn" ${currentIndex === 0 ? "disabled" : ""} onclick="currentIndex--; render(); window.scrollTo(0,0);">&larr; Previous</button>
      <button class="btn ${isLast ? '' : 'primary'}" ${isLast ? "disabled" : ""} onclick="currentIndex++; render(); window.scrollTo(0,0);">Next module &rarr;</button>
    </div>
  `;

  if (isLast && progress[m.id]) {
    const doneCount = Object.keys(progress).filter(k => progress[k]).length;
    if (doneCount === MODULES.length) {
      html = `<div class="completion">
        <div class="big">&#10003;</div>
        <h2 class="module-title">Tutorial complete</h2>
        <p class="module-sub">All ${MODULES.length} modules done. You've run real reconnaissance, hygiene
        scanning across five surface areas, static code review, and genuine exploitation of four major
        vulnerability classes -- against a real target, with a real report to show for it.</p>
      </div>` + html;
    }
  }

  main.innerHTML = html;
  renderNav();
}

render();
</script>
</body>
</html>
