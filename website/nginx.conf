# nginx config baked into the container image (see Dockerfile).
# Listens on plain HTTP inside the container — TLS is terminated by
# whatever sits in front of this container (host nginx reverse proxy,
# Traefik, Caddy, cloud load balancer). Add HSTS at that layer once HTTPS
# is confirmed working end-to-end; sending HSTS from here without TLS in
# front would be wrong (browsers would remember an HTTPS-only rule for a
# site you can't actually serve over HTTPS from this container alone).

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # --- Security headers -------------------------------------------------
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # Real CSP header (in addition to the <meta http-equiv> already in
    # index.html) — headers win and can't be stripped by editing the HTML.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self' 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action https://gumroad.com https://app.gumroad.com; upgrade-insecure-requests" always;

    client_max_body_size 1m;

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /dev/stdout;
    error_log  /dev/stderr;
}
